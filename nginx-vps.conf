server {
    listen 80;
    listen [::]:80;
    server_name api.aarsanjewels.cloud;

    # Redirect HTTP to HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name api.aarsanjewels.cloud;

    ssl_certificate /etc/letsencrypt/live/api.aarsanjewels.cloud/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.aarsanjewels.cloud/privkey.pem;

    # Modern SSL settings
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    # ── Handle CORS preflight (OPTIONS) immediately ────────────────────────
    # This must come BEFORE the proxy_pass location block
    location /api/ {
        # Return 204 for OPTIONS preflight without hitting Express
        if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Allow-Origin' $http_origin always;
            add_header 'Access-Control-Allow-Credentials' 'true' always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type, Accept, X-Requested-With' always;
            add_header 'Access-Control-Max-Age' 86400 always;
            add_header 'Content-Length' 0;
            add_header 'Content-Type' 'text/plain charset=UTF-8';
            return 204;
        }

        proxy_pass http://127.0.0.1:3001/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header Origin $http_origin;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Keep client cookies/session working
        proxy_pass_header Set-Cookie;
        proxy_cookie_domain api.aarsanjewels.cloud .aarsanjewels.cloud;
    }
}
